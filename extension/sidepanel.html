<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WatchParty Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      color-scheme: dark;
      --wp-accent: #6366f1;
      --wp-accent-hover: #5558e6;
      --wp-accent-light: #818cf8;
      --wp-accent-rgb: 99, 102, 241;
      --wp-bg: #11131b;
      --wp-card: #1a1d28;
      --wp-card-strong: rgba(15, 23, 42, 0.94);
      --wp-border: rgba(148, 163, 184, 0.16);
      --wp-border-strong: rgba(148, 163, 184, 0.22);
      --wp-text: #f1f2f7;
      --wp-muted: #adb2c3;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--wp-bg);
      color: var(--wp-text);
      min-height: 100vh;
    }

    body.compact-chat .chat-messages {
      padding: 8px 12px;
      gap: 6px;
    }

    body.compact-chat .chat-msg,
    body.compact-chat .bookmark-msg {
      margin-bottom: 0;
    }

    .shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 14px;
    }

    .panel-card {
      background: var(--wp-card);
      border: 1px solid var(--wp-border);
      border-radius: 12px;
    }

    .hero {
      padding: 4px 2px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #a5b4fc;
      font-weight: 700;
    }

    .hero h1 {
      font-size: 20px;
      line-height: 1.05;
      margin-top: 4px;
    }

    .hero-copy {
      color: var(--wp-muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .hero-actions,
    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .hero-actions .companion-btn:first-child { flex: 1; }
    .hero-copy:empty { display: none; }
    button:focus-visible, a:focus-visible, summary:focus-visible, input:focus-visible {
      outline: 2px solid #b9b2ff;
      outline-offset: 3px;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .room-tools { border-top: 1px solid var(--wp-border); padding-top: 10px; }
    .room-tools summary { color: var(--wp-muted); cursor: pointer; font-size: 12px; }
    .room-tools .action-row, .room-tools .session-links { margin-top: 10px; }

    .room-code {
      appearance: none;
      border: 1px solid rgba(var(--wp-accent-rgb), 0.28);
      background: rgba(var(--wp-accent-rgb), 0.12);
      color: #eef2ff;
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .room-code:hover {
      background: rgba(var(--wp-accent-rgb), 0.18);
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .section-head h2 {
      font-size: 14px;
      line-height: 1.2;
    }

    .section-meta {
      color: var(--wp-muted);
      font-size: 11px;
    }

    .panel-card {
      padding: 16px;
    }

    .status-copy {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .status-title {
      font-size: 18px;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .status-note {
      color: var(--wp-muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 6px 10px;
      background: rgba(148, 163, 184, 0.1);
      border: 1px solid rgba(148, 163, 184, 0.16);
      color: #dbe3f0;
      font-size: 11px;
      font-weight: 700;
    }

    .pill.success {
      color: #bbf7d0;
      border-color: rgba(34, 197, 94, 0.24);
      background: rgba(34, 197, 94, 0.12);
    }

    .pill.warn {
      color: #fde68a;
      border-color: rgba(245, 158, 11, 0.26);
      background: rgba(245, 158, 11, 0.12);
    }

    .companion-btn,
    .action-btn,
    .bookmark-time {
      min-height: 40px;
      appearance: none;
      border: 1px solid var(--wp-border-strong);
      background: rgba(148, 163, 184, 0.08);
      color: var(--wp-text);
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      padding: 9px 12px;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .companion-btn:hover,
    .action-btn:hover,
    .bookmark-time:hover {
      border-color: rgba(var(--wp-accent-rgb), 0.36);
      background: rgba(var(--wp-accent-rgb), 0.15);
    }

    .companion-btn.primary,
    .action-btn.primary {
      background: var(--wp-accent);
      border-color: transparent;
      color: #ffffff;
    }

    .action-btn.leave-btn {
      color: #fecaca;
      border-color: rgba(239, 68, 68, 0.28);
      background: rgba(239, 68, 68, 0.12);
    }

    .action-btn.leave-btn:hover {
      background: rgba(239, 68, 68, 0.18);
      border-color: rgba(239, 68, 68, 0.34);
    }

    .session-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 2px;
    }

    .session-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #dbeafe;
      text-decoration: none;
      font-size: 12px;
      line-height: 1.45;
    }

    .session-link:hover {
      color: #ffffff;
    }

    .sync-indicator {
      font-size: 12px;
      line-height: 1.5;
      color: var(--wp-muted);
    }

    .sync-indicator.sync-ok {
      color: #bbf7d0;
    }

    .sync-indicator.sync-drift {
      color: #fde68a;
    }

    .users {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
    }

    .section-empty {
      color: var(--wp-muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(148, 163, 184, 0.08);
    }

    .user-away {
      opacity: 0.58;
    }

    .user-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .user-copy {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .user-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      color: var(--wp-text);
    }

    .user-subline {
      color: var(--wp-muted);
      font-size: 11px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .user-playhead {
      color: #cbd5f5;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .chat-card {
      flex: 1;
      min-height: 240px;
      display: flex;
      flex-direction: column;
    }

    .chat-container {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      max-height: 45vh;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 4px 0;
      scrollbar-width: thin;
      scrollbar-color: rgba(148, 163, 184, 0.25) transparent;
    }

    .typing-indicator {
      color: var(--wp-muted);
      font-size: 11px;
      font-style: italic;
    }

    .chat-msg,
    .bookmark-msg {
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(148, 163, 184, 0.08);
      line-height: 1.55;
      word-break: break-word;
      font-size: 12px;
    }

    .bookmark-msg {
      background: rgba(var(--wp-accent-rgb), 0.1);
      border-color: rgba(var(--wp-accent-rgb), 0.2);
    }

    .chat-name {
      font-weight: 700;
    }

    .chat-text {
      color: var(--wp-text);
    }

    .chat-input-row {
      display: flex;
      gap: 8px;
      padding-top: 6px;
    }

    .chat-input {
      flex: 1;
      min-width: 0;
      min-height: 44px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }

    .chat-input:focus {
      border-color: rgba(var(--wp-accent-rgb), 0.42);
      box-shadow: 0 0 0 3px rgba(var(--wp-accent-rgb), 0.16);
    }

    .chat-input::placeholder {
      color: #a0a8bd;
    }

    .chat-send {
      min-height: 44px;
      appearance: none;
      border: none;
      border-radius: 12px;
      background: var(--wp-accent);
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      padding: 10px 14px;
      cursor: pointer;
    }

    .chat-send:hover {
      background: var(--wp-accent-hover);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .empty-state p {
      color: var(--wp-muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .toast {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(8, 17, 29, 0.96);
      color: #fff;
      border: 1px solid rgba(var(--wp-accent-rgb), 0.26);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
      z-index: 20;
    }

    .toast.visible {
      opacity: 1;
    }

    .hidden {
      display: none !important;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="hero-top">
        <div>
          <h1>WatchParty</h1>
        </div>
        <button id="room-code" class="room-code hidden" type="button" aria-label="Copy room invite link" title="Copy invite link"></button>
      </div>
      <p id="hero-copy" class="hero-copy">Chat with your room while you watch.</p>
      <div class="hero-actions">
        <button id="sp-open-watchparty-header" class="companion-btn primary" type="button">Open Stremio</button>
        <button id="sp-open-settings-header" class="companion-btn" type="button">Settings</button>
      </div>
    </header>

    <section id="status" class="panel-card status-card">
      <div class="empty-state">
        <h2 class="status-title">You're not in a room yet.</h2>
        <p>Open Stremio and use its WatchParty sidebar to create a room or join friends. Your people and chat will appear here.</p>
      </div>
    </section>

    <section id="sync-indicator" class="panel-card sync-indicator hidden"></section>

    <section class="panel-card hidden" id="people-section">
      <div class="section-head">
        <h2>People</h2>
        <span id="people-count" class="section-meta hidden"></span>
      </div>
      <div id="users" class="users hidden"></div>
      <div id="users-empty" class="section-empty">Waiting for people to join.</div>
    </section>

    <section class="panel-card chat-card hidden" id="chat-section">
      <div class="section-head">
        <h2>Chat</h2>
        <span id="typing-indicator" class="typing-indicator hidden"></span>
      </div>
      <div id="chat-container" class="chat-container hidden">
        <div id="chat-messages" class="chat-messages" role="log" aria-label="Room messages" aria-live="polite"></div>
        <div class="chat-input-row">
          <input id="chat-input" class="chat-input" type="text" placeholder="Message your room…" aria-label="Message your room" maxlength="300" autocomplete="off">
          <button id="chat-send" class="chat-send" type="button">Send</button>
        </div>
      </div>
      <div id="chat-empty" class="section-empty">Join a room to start chatting.</div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="wp-actions.js"></script>
  <script src="constants.js"></script>
  <script src="runtime-state.js"></script>
  <script src="room-keys.js"></script>
  <script src="wp-room-domain.js"></script>
  <script src="wp-direct-play-domain.js"></script>
  <script src="utils.js"></script>
  <script src="direct-play.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
