name: Deploy Website

# Local tests are required before pushing. This job only inspects, deploys and
# verifies the static website; it never installs or tests the application.
on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'cloudflare/**'
      - 'tools/deploy-cloudflare.mjs'
      - '.github/workflows/cloudflare.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect existing Worker without changes, or deploy current main
        type: choice
        options: [inspect, deploy]
        default: inspect

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  website:
    if: >-
      github.repository == 'MertD95/watchparty' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.mode == 'inspect') ||
       vars.CLOUDFLARE_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: cloudflare-production
    env:
      CLOUDFLARE_DEPLOY_ENABLED: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED }}
      CLOUDFLARE_BUILDS_DISCONNECTED: ${{ vars.CLOUDFLARE_BUILDS_DISCONNECTED }}
      CLOUDFLARE_ASSETS_ONLY_CONFIRMED: ${{ vars.CLOUDFLARE_ASSETS_ONLY_CONFIRMED }}
      CLOUDFLARE_EXPECTED_SETTINGS_SHA256: ${{ vars.CLOUDFLARE_EXPECTED_SETTINGS_SHA256 }}
      CLOUDFLARE_ACCOUNT_ID: '746a45a10fa0fc109de9f77a9955349c'
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Verify trusted current main
        run: node tools/deploy-cloudflare.mjs source
      - name: Inspect existing Worker (read only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'inspect'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tools/deploy-cloudflare.mjs inspect
      - name: Prepare deployment from approved existing settings
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tools/deploy-cloudflare.mjs prepare
      - name: Cache pinned deployment CLI without credentials
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy'
        run: npx --yes --package=wrangler@4.147.0 wrangler --version
      - name: Deploy only landing assets
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node tools/deploy-cloudflare.mjs source
          npx --offline --yes --package=wrangler@4.147.0 wrangler deploy --config dist/cloudflare/wrangler.json --keep-vars --message "WatchParty website $GITHUB_SHA"
      - name: Verify live asset hashes and routes
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy'
        run: node tools/deploy-cloudflare.mjs verify
