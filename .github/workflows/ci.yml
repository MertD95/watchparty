name: Manual Package Check

# Product tests run locally before pushing; no push/PR Actions minutes are used.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Build and verify store artifact (no tests or dependency install)
        run: |
          node tools/build-store-package.mjs
          node tools/validate-store-package.mjs dist/chrome-web-store/watchparty-for-stremio.zip
