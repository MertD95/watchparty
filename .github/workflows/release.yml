name: Extension Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: 'Upload this ref and submit to Google review (publishes after approval)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Never overlap two store submissions, even when they originate from different refs.
concurrency:
  group: watchparty-extension-release
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PACKAGE_NAME: watchparty-extension.zip

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-artifacts
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Package extension (no tests or dependency install)
        run: |
          node tools/build-store-package.mjs
          cp dist/chrome-web-store/watchparty-for-stremio.zip "${PACKAGE_NAME}"
          node tools/validate-store-package.mjs "${PACKAGE_NAME}"
          sha256sum "${PACKAGE_NAME}" > "${PACKAGE_NAME}.sha256"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: extension-package
          path: |
            ${{ env.PACKAGE_NAME }}
            ${{ env.PACKAGE_NAME }}.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090
        with:
          files: |
            ${{ env.PACKAGE_NAME }}
            ${{ env.PACKAGE_NAME }}.sha256

  chrome-submit:
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.submit_for_review == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: chrome-web-store
    steps:
      - name: Require explicit store enablement
        env:
          CHROME_PUBLISH_ENABLED: ${{ vars.CHROME_PUBLISH_ENABLED }}
        run: |
          if [ "${CHROME_PUBLISH_ENABLED}" != 'true' ]; then
            echo '::error::Set CHROME_PUBLISH_ENABLED=true only after configuring and approving the chrome-web-store environment.'
            exit 1
          fi
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: extension-package
      - name: Verify artifact checksum
        run: sha256sum --check "${PACKAGE_NAME}.sha256"
      - name: Submit with Chrome Web Store API v2
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: node tools/publish-chrome-web-store.mjs --submit "${PACKAGE_NAME}"
