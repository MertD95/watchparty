name: Extension Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Package, submit for staged review, check status, or explicitly publish/cancel an exact version'
        required: true
        default: status
        type: choice
        options: [status, package, submit, cancel-review, publish-staged]
      release_tag:
        description: 'Existing stable tag for package/submit (e.g. v2.1.0); ignored for other modes'
        required: false
        type: string
      expected_version:
        description: 'Required for cancel-review or publish-staged: exact pending/staged version (e.g. 2.1.0). Never automatic.'
        required: false
        type: string

permissions:
  contents: read

# Never overlap two store submissions, even when they originate from different refs.
concurrency:
  group: watchparty-extension-release
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PACKAGE_NAME: watchparty-extension.zip

jobs:
  package:
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'package' || inputs.mode == 'submit'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-artifacts
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.source.outputs.release_tag }}
      release_sha: ${{ steps.source.outputs.release_sha }}
    steps:
      - name: Checkout workflow tools (manual runs use the dispatched main commit)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify trusted release source
        id: source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          CHROME_RELEASE_CANDIDATE_SHA: ${{ vars.CHROME_RELEASE_CANDIDATE_SHA }}
        run: node tools/verify-release-source.mjs
      - name: Checkout exact tested tag separately from workflow tools
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ steps.source.outputs.release_sha }}
          path: release-source
          persist-credentials: false
      - name: Package extension (no tests or dependency install)
        env:
          CHROME_RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        run: |
          node release-source/tools/build-store-package.mjs
          cp release-source/dist/chrome-web-store/watchparty-for-stremio.zip "${PACKAGE_NAME}"
          node tools/validate-store-package.mjs "${PACKAGE_NAME}"
          node --input-type=module -e 'import fs from "node:fs"; import { validateReleasePackage } from "./tools/publish-chrome-web-store.mjs"; validateReleasePackage(fs.readFileSync(process.env.PACKAGE_NAME), process.env.CHROME_RELEASE_TAG);'
          sha256sum "${PACKAGE_NAME}" > "${PACKAGE_NAME}.sha256"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: extension-package
          path: |
            ${{ env.PACKAGE_NAME }}
            ${{ env.PACKAGE_NAME }}.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090
        with:
          files: |
            ${{ env.PACKAGE_NAME }}
            ${{ env.PACKAGE_NAME }}.sha256

  chrome-store:
    needs: package
    # CHROME_PUBLISH_ENABLED is a repository variable so this gate is evaluated
    # before entering the environment. A disabled manual submit fails closed below.
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'workflow_dispatch' && (inputs.mode == 'status' || inputs.mode == 'cancel-review' || inputs.mode == 'publish-staged')) ||
       (needs.package.result == 'success' &&
        ((github.event_name == 'workflow_dispatch' && inputs.mode == 'submit') ||
         (github.event_name == 'release' && vars.CHROME_PUBLISH_ENABLED == 'true'))))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write
    env:
      CHROME_PUBLISH_ENABLED: ${{ vars.CHROME_PUBLISH_ENABLED }}
      CHROME_RELEASE_TAG: ${{ needs.package.outputs.release_tag }}
      STORE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'submit' }}
      CHROME_EXPECTED_PENDING_VERSION: ${{ inputs.expected_version }}
      CHROME_EXPECTED_STAGED_VERSION: ${{ inputs.expected_version }}
    steps:
      - name: Require trusted invocation and configured store identity
        env:
          CHROME_AUTH_MODE: ${{ vars.CHROME_AUTH_MODE }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID || secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID || secrets.CHROME_PUBLISHER_ID }}
          GOOGLE_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          GOOGLE_SERVICE_ACCOUNT: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = 'MertD95/watchparty'
          if [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ]; then
            test "${GITHUB_REF}" = 'refs/heads/main'
          fi
          case "${STORE_MODE}" in
            status|submit|cancel-review|publish-staged) ;;
            *) echo '::error::Unsupported store operation.'; exit 1 ;;
          esac
          if [ "${STORE_MODE}" != 'status' ] && [ "${CHROME_PUBLISH_ENABLED}" != 'true' ]; then
            echo '::error::Set the repository variable CHROME_PUBLISH_ENABLED=true only after a successful status check.'
            exit 1
          fi
          if [ "${STORE_MODE}" = 'cancel-review' ]; then
            test "${GITHUB_EVENT_NAME}" = 'workflow_dispatch'
            if ! [[ "${CHROME_EXPECTED_PENDING_VERSION}" =~ ^(0|[1-9][0-9]{0,4})(\.(0|[1-9][0-9]{0,4})){0,3}$ ]]; then
              echo '::error::Provide the exact expected pending version before cancelling its review.'
              exit 1
            fi
          fi
          if [ "${STORE_MODE}" = 'publish-staged' ]; then
            test "${GITHUB_EVENT_NAME}" = 'workflow_dispatch'
            if ! [[ "${CHROME_EXPECTED_STAGED_VERSION}" =~ ^(0|[1-9][0-9]{0,4})(\.(0|[1-9][0-9]{0,4})){0,3}$ ]]; then
              echo '::error::Provide the exact approved staged version before publishing.'
              exit 1
            fi
          fi
          case "${CHROME_AUTH_MODE}" in
            wif) required_variables='GOOGLE_WORKLOAD_IDENTITY_PROVIDER GOOGLE_SERVICE_ACCOUNT CHROME_EXTENSION_ID CHROME_PUBLISHER_ID' ;;
            oauth) required_variables='CHROME_EXTENSION_ID CHROME_PUBLISHER_ID' ;;
            *) echo '::error::Set CHROME_AUTH_MODE to wif or oauth in the chrome-web-store environment.'; exit 1 ;;
          esac
          for variable in ${required_variables}; do
            if [ -z "${!variable}" ]; then
              echo "::error::Configure ${variable} in the chrome-web-store environment."
              exit 1
            fi
          done
      - name: Checkout publisher from the trusted workflow commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: env.STORE_MODE == 'submit'
        with:
          name: extension-package
      - name: Verify artifact checksum and exact release version before authentication
        if: env.STORE_MODE == 'submit'
        run: |
          sha256sum --check "${PACKAGE_NAME}.sha256"
          node --input-type=module -e 'import fs from "node:fs"; import { validateReleasePackage } from "./tools/publish-chrome-web-store.mjs"; validateReleasePackage(fs.readFileSync(process.env.PACKAGE_NAME), process.env.CHROME_RELEASE_TAG);'
      - name: Obtain short-lived Chrome Web Store access token
        if: vars.CHROME_AUTH_MODE == 'wif'
        id: google-auth
        # Official google-github-actions/auth v3.0.0, pinned to its release commit.
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Run explicitly selected store operation using short-lived WIF token
        if: vars.CHROME_AUTH_MODE == 'wif'
        env:
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID || secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID || secrets.CHROME_PUBLISHER_ID }}
          CHROME_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          case "${STORE_MODE}" in
            status) node tools/publish-chrome-web-store.mjs --status ;;
            cancel-review) node tools/publish-chrome-web-store.mjs --cancel-review "${CHROME_EXPECTED_PENDING_VERSION}" ;;
            publish-staged) node tools/publish-chrome-web-store.mjs --publish-staged "${CHROME_EXPECTED_STAGED_VERSION}" ;;
            submit) node tools/publish-chrome-web-store.mjs --submit "${PACKAGE_NAME}" ;;
            *) exit 1 ;;
          esac
      - name: Run explicitly selected store operation using configured OAuth credentials
        if: vars.CHROME_AUTH_MODE == 'oauth'
        env:
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID || secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID || secrets.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          case "${STORE_MODE}" in
            status) node tools/publish-chrome-web-store.mjs --status ;;
            cancel-review) node tools/publish-chrome-web-store.mjs --cancel-review "${CHROME_EXPECTED_PENDING_VERSION}" ;;
            publish-staged) node tools/publish-chrome-web-store.mjs --publish-staged "${CHROME_EXPECTED_STAGED_VERSION}" ;;
            submit) node tools/publish-chrome-web-store.mjs --submit "${PACKAGE_NAME}" ;;
            *) exit 1 ;;
          esac
